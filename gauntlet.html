<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TT Gauntlet Helper</title>

<style>
:root {
    color-scheme: dark;
    --bg: rgba(15, 15, 15, 0.96);
    --panel: rgba(255, 255, 255, 0.06);
    --panel-strong: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --accent: #2d89ff;
    --accent-hover: #4da0ff;
    --danger: #ff4d4d;
    --green: #66ff88;
    --yellow: #ffd966;
    --red: #ff7373;
    --blue: #63b3ff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    display: flex;
    min-height: 100vh;
    padding: 8px;
    flex-direction: column;
}

.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 34px;
    margin-bottom: 6px;
}

h1 {
    margin: 0;
    font-size: 20px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}

button {
    width: 100%;
    min-height: 34px;
    padding: 8px 10px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--text);
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: var(--accent-hover);
}

.icon-button {
    width: 36px;
    min-width: 36px;
    min-height: 34px;
    margin-top: 0;
    padding: 0;
    background: var(--danger);
    font-weight: bold;
}

.tab {
    flex: 1;
    margin-top: 0;
    background: #333333;
}

.tab.active {
    background: var(--accent);
}
